<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Formula Explainer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
        }

        /* Upload zone - default state */
        .upload-zone {
            width: 100%;
            max-width: 600px;
            border: 2px dashed #334155;
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
        }

        .upload-zone:hover {
            border-color: #3b82f6;
            background: #1e293b;
        }

        .upload-zone.dragover {
            border-color: #3b82f6;
            background: #1e293b;
        }

        .upload-zone.has-file {
            border-style: solid;
            border-color: #22c55e;
            background: #0f2a1e;
            padding: 24px 30px;
            cursor: default;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .upload-text {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .upload-hint {
            color: #64748b;
            font-size: 0.85rem;
        }

        input[type="file"] {
            display: none;
        }

        /* File info bar (shown after upload) */
        .file-info {
            display: none;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .file-info.active {
            display: flex;
        }

        .file-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-icon {
            font-size: 1.8rem;
        }

        .file-name {
            font-weight: 600;
            font-size: 1rem;
            color: #e2e8f0;
        }

        .file-size {
            font-size: 0.8rem;
            color: #6ee7b7;
        }

        .file-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-change {
            background: #334155;
            color: #e2e8f0;
        }

        .btn-change:hover {
            background: #475569;
        }

        .btn-download {
            background: #3b82f6;
            color: #ffffff;
            display: none;
        }

        .btn-download.active {
            display: inline-block;
        }

        .btn-download:hover {
            background: #2563eb;
        }

        /* Default upload content */
        .upload-default {
            display: block;
        }

        .upload-default.hidden {
            display: none;
        }

        /* Loading state */
        .loading {
            margin-top: 24px;
            display: none;
            text-align: center;
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #334155;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Summary card */
        .summary {
            margin-top: 24px;
            padding: 20px 28px;
            border-radius: 12px;
            background: #1e293b;
            border: 1px solid #334155;
            width: 100%;
            max-width: 600px;
            display: none;
        }

        .summary.active {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .summary-number {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .summary-label {
            color: #94a3b8;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .num-total { color: #3b82f6; }
        .num-complex { color: #f59e0b; }
        .num-broken { color: #ef4444; }

        /* Error bar */
        .error-bar {
            margin-top: 24px;
            padding: 16px 24px;
            border-radius: 12px;
            background: #7f1d1d;
            color: #fca5a5;
            display: none;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .error-bar.active {
            display: block;
        }

        /* Formula cards */
        .results {
            margin-top: 24px;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .formula-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            transition: border-color 0.3s;
        }

        .formula-card:hover {
            border-color: #475569;
        }

        .formula-card.complex {
            border-left: 4px solid #f59e0b;
        }

        .formula-card.broken {
            border-left: 4px solid #ef4444;
        }

        .formula-card.simple {
            border-left: 4px solid #22c55e;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .cell-ref {
            font-weight: 600;
            color: #3b82f6;
            font-size: 0.95rem;
        }

        .badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-complex {
            background: #78350f;
            color: #fbbf24;
        }

        .badge-simple {
            background: #064e3b;
            color: #6ee7b7;
        }

        .badge-broken {
            background: #7f1d1d;
            color: #fca5a5;
            margin-left: 6px;
        }

        .formula-raw {
            background: #0f172a;
            padding: 10px 14px;
            border-radius: 8px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85rem;
            color: #e2e8f0;
            margin-bottom: 14px;
            word-break: break-all;
            line-height: 1.5;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .explanation {
            color: #cbd5e1;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .simplified {
            background: #0f172a;
            padding: 10px 14px;
            border-radius: 8px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85rem;
            color: #34d399;
            word-break: break-all;
            line-height: 1.5;
        }

        .broken-list {
            margin-top: 10px;
            padding: 10px 14px;
            background: #450a0a;
            border-radius: 8px;
            color: #fca5a5;
            font-size: 0.85rem;
        }

        .no-formulas {
            text-align: center;
            color: #64748b;
            margin-top: 24px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <h1>📊 Excel Formula Explainer</h1>
    <p class="subtitle">Upload your spreadsheet. We'll explain every formula.</p>

    <div class="upload-zone" id="dropZone">
        <div class="upload-default" id="uploadDefault">
            <div class="upload-icon">📁</div>
            <p class="upload-text">Drop your Excel file here, or click to upload</p>
            <p class="upload-hint">.xlsx files only · Max 5 MB</p>
        </div>

        <div class="file-info" id="fileInfo">
            <div class="file-details">
                <span class="file-icon">📄</span>
                <div>
                    <div class="file-name" id="fileName">filename.xlsx</div>
                    <div class="file-size" id="fileSize">12.3 KB</div>
                </div>
            </div>
            <div class="file-actions">
                <button class="btn btn-download" id="downloadBtn" title="Download results">⬇ Results</button>
                <button class="btn btn-change" id="changeBtn" title="Upload a different file">🔄 Change</button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".xlsx">

    <div class="loading" id="loading">
        <span class="spinner"></span>
        <span id="loadingText">Analyzing your spreadsheet...</span>
    </div>

    <div class="error-bar" id="errorBar"></div>

    <div class="summary" id="summary">
        <div class="summary-item">
            <span class="summary-number num-total" id="totalCount">0</span>
            <span class="summary-label">Formulas</span>
        </div>
        <div class="summary-item">
            <span class="summary-number num-complex" id="complexCount">0</span>
            <span class="summary-label">Complex</span>
        </div>
        <div class="summary-item">
            <span class="summary-number num-broken" id="brokenCount">0</span>
            <span class="summary-label">Broken</span>
        </div>
    </div>

    <div class="results" id="results"></div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const uploadDefault = document.getElementById('uploadDefault');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileInput = document.getElementById('fileInput');
        const changeBtn = document.getElementById('changeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const errorBar = document.getElementById('errorBar');
        const summary = document.getElementById('summary');
        const results = document.getElementById('results');

        let currentResults = null;

        const loadingMessages = [
            'Analyzing your spreadsheet...',
            'Scanning for formulas...',
            'Checking for complex patterns...',
            'Asking AI to explain formulas...',
            'Almost there...'
        ];

        let loadingInterval;

        // Click upload zone only when no file is loaded
        dropZone.addEventListener('click', (e) => {
            if (!dropZone.classList.contains('has-file')) {
                fileInput.click();
            }
        });

        // Change button opens file picker
        changeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        // Download button
        downloadBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentResults) downloadResults();
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) uploadFile(file);
        });

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) uploadFile(file);
        });

        function showFileInfo(file) {
            fileName.textContent = file.name;
            const sizeKB = (file.size / 1024).toFixed(1);
            fileSize.textContent = sizeKB > 1024 ? (file.size / (1024 * 1024)).toFixed(1) + ' MB' : sizeKB + ' KB';

            uploadDefault.classList.add('hidden');
            fileInfo.classList.add('active');
            dropZone.classList.add('has-file');
        }

        function resetUpload() {
            uploadDefault.classList.remove('hidden');
            fileInfo.classList.remove('active');
            dropZone.classList.remove('has-file');
            downloadBtn.classList.remove('active');
            summary.classList.remove('active');
            errorBar.classList.remove('active');
            results.innerHTML = '';
            currentResults = null;
            fileInput.value = '';
        }

        function startLoading() {
            loading.classList.add('active');
            summary.classList.remove('active');
            errorBar.classList.remove('active');
            results.innerHTML = '';
            downloadBtn.classList.remove('active');

            let i = 0;
            loadingInterval = setInterval(() => {
                i = (i + 1) % loadingMessages.length;
                loadingText.textContent = loadingMessages[i];
            }, 2500);
        }

        function stopLoading() {
            loading.classList.remove('active');
            clearInterval(loadingInterval);
        }

        function showError(message) {
            errorBar.textContent = '❌ ' + message;
            errorBar.classList.add('active');
        }

        function downloadResults() {
            if (!currentResults) return;

            let text = `Excel Formula Explainer - Analysis Report\n`;
            text += `==========================================\n\n`;
            text += `Total Formulas: ${currentResults.total_formulas}\n`;
            text += `Complex: ${currentResults.complex_count}\n`;
            text += `Broken References: ${currentResults.broken_count}\n\n`;

            currentResults.formulas.forEach(f => {
                text += `-------------------------------------------\n`;
                text += `Cell: ${f.cell}\n`;
                text += `Type: ${f.is_complex ? 'Complex' : 'Simple'}\n`;
                text += `Formula: ${f.formula}\n`;
                if (f.explanation) text += `Explanation: ${f.explanation}\n`;
                if (f.is_complex && f.simplified) text += `Simplified: ${f.simplified}\n`;
                if (f.broken_refs && f.broken_refs.length > 0) text += `Broken Refs: ${f.broken_refs.join(', ')}\n`;
                text += `\n`;
            });

            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'formula-analysis-report.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        function renderResults(data) {
            currentResults = data;

            document.getElementById('totalCount').textContent = data.total_formulas;
            document.getElementById('complexCount').textContent = data.complex_count;
            document.getElementById('brokenCount').textContent = data.broken_count;
            summary.classList.add('active');
            downloadBtn.classList.add('active');

            if (data.formulas.length === 0) {
                results.innerHTML = '<p class="no-formulas">No formulas found in this file.</p>';
                return;
            }

            const sorted = data.formulas.sort((a, b) => {
                if (a.is_complex !== b.is_complex) return b.is_complex - a.is_complex;
                if (a.broken_refs.length !== b.broken_refs.length) return b.broken_refs.length - a.broken_refs.length;
                return 0;
            });

            results.innerHTML = sorted.map(f => {
                const cardClass = f.broken_refs.length > 0 ? 'broken' : (f.is_complex ? 'complex' : 'simple');

                let badges = f.is_complex
                    ? '<span class="badge badge-complex">Complex</span>'
                    : '<span class="badge badge-simple">Simple</span>';

                if (f.broken_refs.length > 0) {
                    badges += '<span class="badge badge-broken">Broken Ref</span>';
                }

                let sections = `
                    <div class="section-label">Formula</div>
                    <div class="formula-raw">${f.formula}</div>
                `;

                if (f.explanation) {
                    sections += `
                        <div class="section-label">Explanation</div>
                        <div class="explanation">${f.explanation}</div>
                    `;
                }

                if (f.is_complex && f.simplified) {
                    sections += `
                        <div class="section-label">Suggested Simplification</div>
                        <div class="simplified">${f.simplified}</div>
                    `;
                }

                if (f.broken_refs.length > 0) {
                    sections += `
                        <div class="broken-list">⚠️ Broken references: ${f.broken_refs.join(', ')}</div>
                    `;
                }

                return `
                    <div class="formula-card ${cardClass}">
                        <div class="card-header">
                            <span class="cell-ref">📍 ${f.cell}</span>
                            <div>${badges}</div>
                        </div>
                        ${sections}
                    </div>
                `;
            }).join('');
        }

        async function uploadFile(file) {
            showFileInfo(file);
            startLoading();

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                stopLoading();

                if (response.ok) {
                    renderResults(data);
                } else {
                    showError(data.error);
                }
            } catch (err) {
                stopLoading();
                showError('Something went wrong. Try again.');
            }
        }
    </script>
</body>
</html>
